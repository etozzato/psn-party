services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - config/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-psn_add}
      POSTGRES_USER: ${POSTGRES_USER:-psn_add}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psn_add} -d ${POSTGRES_DB:-psn_add}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-prod}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - config/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-psn_add}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-psn_add}?sslmode=disable
      BIND_ADDRESS: 0.0.0.0
    ports:
      - "${HOST_PORT:-8890}:8890"

volumes:
  postgres_data:
